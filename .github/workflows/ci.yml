name: CI

# Scorecard for docs/AUTONOMOUS-HARDENING-PLAN.md Tier 1.
# Every step here is a gate: it exits 0 or non-zero, and nothing is subjective.
#
# PROTECTED PATH. Weakening a gate to make a run go green (removing a step, adding
# continue-on-error, lowering a coverage threshold) is a guardrail trip, not a fix.
# If a gate fails, the assumption is that the code is wrong.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (fail the build on any committed secret)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the sitemap plugin derives <lastmod> from each route file's last
          # commit date. A shallow clone would make it omit lastmod entirely.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Cheap checks first, so an obvious failure does not wait on a build.

      - name: House style (no em dashes in prose or code)
        run: |
          # Text files only: the old rule recursed into src/assets PNGs and routeTree.gen.ts.
          if grep -rn --binary-files=without-match \
               --include="*.ts" --include="*.tsx" --include="*.md" \
               --include="*.txt" --include="*.json" --include="*.css" --include="*.yml" \
               --exclude="routeTree.gen.ts" \
               "—" src/ docs/ docs-internal/ public/ README.md; then
            echo "::error::Em dash found. House style: use a period, comma, colon, or 'to' for ranges."
            exit 1
          fi

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      # Test tooling is installed additively rather than added to package.json, because the
      # lockfile could not be regenerated in the authoring environment (bun install fails
      # there with ConnectionClosed). --no-save keeps bun.lock untouched so the app's own
      # dependencies stay frozen and reproducible.
      # TODO: move vitest + @vitest/coverage-v8 into devDependencies and commit the updated
      # bun.lock from a machine with reliable network, then delete this step.
      - name: Install test tooling
        run: bun add --no-save vitest @vitest/coverage-v8

      - name: Unit tests with coverage
        run: bunx vitest run --coverage

      - name: Build
        run: bun run build

      # Static GEO checks. These need no network and no secrets, so they belong in Tier 1.
      # The live-surface checks (sitemap URLs resolving, llms.txt claims matching the
      # database) are Tier 2 and run against the Vercel preview once Phase 3 lands.
      - name: GEO artifacts
        run: bun scripts/check-geo.ts
