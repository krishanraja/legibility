name: CI

# Scorecard for docs/AUTONOMOUS-HARDENING-PLAN.md Tier 1.
# Every step here is a gate: it exits 0 or non-zero, and nothing is subjective.
#
# PROTECTED PATH. Weakening a gate to make a run go green (removing a step, adding
# continue-on-error, lowering a coverage threshold) is a guardrail trip, not a fix.
# If a gate fails, the assumption is that the code is wrong.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (fail the build on any committed secret)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the sitemap plugin derives <lastmod> from each route file's last
          # commit date. A shallow clone would make it omit lastmod entirely.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Cheap checks first, so an obvious failure does not wait on a build.

      - name: House style (no em dashes in prose or code)
        run: |
          # Text files only: the old rule recursed into src/assets PNGs and routeTree.gen.ts.
          if grep -rn --binary-files=without-match \
               --include="*.ts" --include="*.tsx" --include="*.md" \
               --include="*.txt" --include="*.json" --include="*.css" --include="*.yml" \
               --exclude="routeTree.gen.ts" \
               "—" src/ docs/ docs-internal/ public/ README.md; then
            echo "::error::Em dash found. House style: use a period, comma, colon, or 'to' for ranges."
            exit 1
          fi

      - name: Format check
        run: bun run format:check

      # vitest and @vitest/coverage-v8 are now ordinary devDependencies, installed by the
      # step above. The separate `bun add --no-save` step this replaces existed only because
      # bun install could not complete in the authoring environment, which turned out to be
      # two lockfile defects rather than a network fault. Both are fixed, so the tooling is
      # pinned in bun.lock like everything else and CI no longer resolves it at run time.

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Unit tests with coverage
        run: bunx vitest run --coverage

      - name: Build
        run: bun run build

      # Fails if a published calibration figure no longer matches golden_eval_runs. Needs
      # the database, so it is skipped when the secret is absent (forks) rather than
      # failing for a reason a contributor cannot fix.
      #
      # The condition reads `secrets`, not `env`. It was `env.SUPABASE_SERVICE_ROLE_KEY`,
      # which cannot work: a step's own `env:` block is not in scope for that step's own
      # `if`, so the expression evaluated against an empty context and was always false.
      # Both database steps had therefore never executed. Confirmed on run 57, where both
      # report "skipped" on a commit that changed the database they check.
      #
      # That is the worst kind of gate. This repo's central claim is that a published
      # number can only be a number that was measured and stored, and the mechanism
      # enforcing it had never once run.
      - name: Calibration figures match the stored run
        if: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun scripts/sync-calibration.ts --check

      # Same arrangement as calibration: the public pricing card reads src/data/plans.json,
      # generated from the plans table, so what the page advertises cannot drift from what
      # entitlement_check enforces. An earlier hand-typed version of that card advertised a
      # Slack channel and an SLA that did not exist.
      - name: Plan figures match the plans table
        if: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun scripts/sync-plans.ts --check

      # llms-full.txt is generated from llms.txt and the failure-reason content, so the long
      # form cannot drift from the pages it summarises. Needs no secrets.
      - name: llms-full.txt matches its sources
        run: bun scripts/build-llms-full.ts --check

      # Static GEO checks. These need no network and no secrets, so they belong in Tier 1.
      # They also now gate the copy register: the banned-phrase list is the thing standing
      # between the front page and the vendor-email voice its buyer has learned to distrust.
      - name: GEO artifacts
        run: bun scripts/check-geo.ts
